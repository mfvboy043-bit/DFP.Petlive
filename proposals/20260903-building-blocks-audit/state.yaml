  - "SEC-1 (fixed in build): clinics load() now re-reads storage, restoring pre-slot
     read-through so a second tab cannot clobber saved clinics"
  - "SEC-2 (L2): consent is memory-cached with no invalidation hook. Benign today —
     clearLocalPetliveData does not wipe petlive-legal-consent. If a future reset adds
     that key it must also call consentSlot(doc)?.invalidate() or the gate can skip."
  - "SEC-3 (I1): setLegalConsentStorage is a console-reachable seam. No privilege gained
     over localStorage.setItem; acceptable."
  - "SEC-4 (C4): markLegalConsent still swallows a failed write, so a quota-exhausted
     user is admitted without a consent record. Pre-existing behaviour, not a regression."
  - "Informational: clinics slot inherits globalConfig.backend. Local on both surfaces
     today; if IDB is switched on, clinic names would also land in IndexedDB — check
     against privacy copy or pin backend: local."
  - "Forward-looking: neither surface sets body.dataset.legalConsentKey. If C ever loads
     shell/legal-consent.js it would silently share B's petlive-legal-consent key."
